<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.trailer-layout{width:100%;height:565px;display:grid;grid-template-columns:minmax(0,2.8fr) minmax(315px,1fr);gap:14px;background:#000;overflow:hidden}.trailer-hero{position:relative;min-width:0;height:565px;overflow:hidden;border-radius:12px 0 0 12px;background:#050505}.hero-main{position:absolute;inset:0;z-index:1;display:block;color:#fff;text-decoration:none;cursor:pointer}.hero-backdrop{width:100%;height:100%;object-fit:cover;display:block}.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.99) 0%,rgba(0,0,0,.90) 24%,rgba(0,0,0,.23) 62%,rgba(0,0,0,.04) 100%)}.hero-arrow{position:absolute;top:36%;z-index:30;width:52px;height:68px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.8);border-radius:5px;background:rgba(0,0,0,.48);color:#fff;font-size:48px;line-height:1;cursor:pointer;user-select:none}.hero-arrow:hover{background:rgba(0,0,0,.72)}.hero-arrow-left{left:0}.hero-arrow-right{right:0}.hero-bottom{position:absolute;left:16px;right:18px;bottom:18px;z-index:3;display:flex;align-items:flex-end;gap:16px;pointer-events:none}.hero-poster-wrap{position:relative;flex:0 0 165px;width:165px;height:245px}.hero-poster{width:100%;height:100%;object-fit:cover;border-radius:9px}.hero-plus{position:absolute;top:0;left:0;width:44px;height:51px;display:flex;align-items:center;justify-content:center;border-radius:8px 0 8px 0;background:rgba(16,16,16,.95);color:#fff;font-size:30px}.hero-info{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding-bottom:8px}.hero-play{flex:0 0 72px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:4px solid #fff;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:30px;padding-left:5px}.hero-text{min-width:0}.hero-title-line{display:flex;align-items:baseline;gap:14px;min-width:0}.hero-title{margin:0;overflow:hidden;color:#fff;font-size:28px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.hero-duration{color:#d1d5db;font-size:17px;white-space:nowrap}.hero-subtitle{margin-top:6px;max-width:720px;overflow:hidden;color:#d1d5db;font-size:15px;text-overflow:ellipsis;white-space:nowrap}.hero-rating{margin-top:8px;color:#facc15;font-size:15px}.up-next{height:565px;min-width:315px;overflow:hidden;padding:6px 8px 10px 0;background:#000}.up-heading{margin:0 0 13px;color:#f5c518;font-size:20px;font-weight:800}.up-list{display:flex;flex-direction:column;gap:10px}.up-card{min-height:137px;display:flex;gap:13px;padding:7px 5px;border-radius:8px;background:linear-gradient(90deg,rgba(24,24,24,.98),rgba(0,0,0,.98));color:#fff;cursor:pointer}.up-card:hover{background:#202020}.up-poster{flex:0 0 88px;width:88px;height:132px;object-fit:cover;border-radius:8px}.up-info{min-width:0;padding-top:3px}.up-meta{display:flex;align-items:center;gap:8px;color:#d1d5db;font-size:13px}.up-play{width:31px;height:31px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:50%;font-size:12px}.up-title{margin-top:7px;display:-webkit-box;overflow:hidden;color:#fff;font-size:15px;font-weight:750;line-height:1.25;-webkit-box-orient:vertical;-webkit-line-clamp:2}.up-watch{margin-top:3px;color:#d1d5db;font-size:14px}.up-stats{margin-top:7px;color:#facc15;font-size:13px}.browse{margin-top:11px;padding-left:8px;color:#fff;font-size:16px;font-weight:750}@media(max-width:850px){.trailer-layout{grid-template-columns:1fr}.up-next{display:none}.trailer-hero{border-radius:12px}}
</style>
</head>
<body>
<div class="trailer-layout">
<section class="trailer-hero">
<button class="hero-arrow hero-arrow-left" id="prevButton" type="button">‹</button>
<button class="hero-arrow hero-arrow-right" id="nextButton" type="button">›</button>
<div class="hero-main" id="heroMain" role="button" tabindex="0">
<img class="hero-backdrop" id="heroBackdrop" alt="Trailer backdrop">
<div class="hero-overlay"></div>
<div class="hero-bottom"><div class="hero-poster-wrap"><img class="hero-poster" id="heroPoster" alt="Movie poster"><div class="hero-plus">+</div></div><div class="hero-info"><div class="hero-play">▶</div><div class="hero-text"><div class="hero-title-line"><h2 class="hero-title" id="heroTitle"></h2><span class="hero-duration" id="heroDuration"></span></div><div class="hero-subtitle" id="heroSubtitle"></div><div class="hero-rating" id="heroRating"></div></div></div></div>
</div>
</section>
<aside class="up-next"><div class="up-heading">Up next</div><div class="up-list" id="upList"></div><div class="browse">Browse trailers ›</div></aside>
</div>
<script>
let slides=[];let currentIndex=0;let autoTimer=null;let autoSlideMs=5000;
const heroMain=document.getElementById('heroMain'),heroBackdrop=document.getElementById('heroBackdrop'),heroPoster=document.getElementById('heroPoster'),heroTitle=document.getElementById('heroTitle'),heroDuration=document.getElementById('heroDuration'),heroSubtitle=document.getElementById('heroSubtitle'),heroRating=document.getElementById('heroRating'),upList=document.getElementById('upList');
function send(type,data={}){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),'*')}
function ready(){send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:575})}
function setValue(value){send('streamlit:setComponentValue',{value:value,dataType:'json'})}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function renderUpNext(){upList.innerHTML='';const count=Math.min(3,Math.max(0,slides.length-1));for(let o=1;o<=count;o++){const index=(currentIndex+o)%slides.length,item=slides[index],card=document.createElement('div');card.className='up-card';card.innerHTML=`<img class="up-poster" src="${esc(item.poster)}" alt="${esc(item.title)}"><div class="up-info"><div class="up-meta"><span class="up-play">▶</span><span>${esc(item.duration)}</span></div><div class="up-title">${esc(item.title)}</div><div class="up-watch">Watch Now</div><div class="up-stats">${esc(item.rating)}</div></div>`;card.addEventListener('click',()=>showSlide(index,true));upList.appendChild(card)}}
function renderSlide(){if(!slides.length)return;const s=slides[currentIndex];heroBackdrop.src=s.backdrop||'';heroPoster.src=s.poster||'';heroTitle.textContent=s.title||'';heroDuration.textContent=s.duration||'';heroSubtitle.textContent=s.subtitle||'';heroRating.textContent=s.rating||'';renderUpNext()}
function restart(){if(autoTimer)clearInterval(autoTimer);if(slides.length>1)autoTimer=setInterval(()=>showSlide(currentIndex+1,false),autoSlideMs)}
function showSlide(index,restartTimer=true){if(!slides.length)return;currentIndex=(index+slides.length)%slides.length;renderSlide();if(restartTimer)restart()}
function openCurrent(){if(slides.length)setValue(slides[currentIndex].tmdb_id)}
document.getElementById('prevButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showSlide(currentIndex-1,true)});document.getElementById('nextButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showSlide(currentIndex+1,true)});heroMain.addEventListener('click',openCurrent);heroMain.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCurrent()}});
window.addEventListener('message',event=>{const d=event.data;if(!d||d.type!=='streamlit:render')return;const args=d.args||{};slides=Array.isArray(args.slides)?args.slides:[];autoSlideMs=Number(args.auto_slide_ms)||5000;currentIndex=Math.max(0,Math.min(Number(args.start_index)||0,Math.max(0,slides.length-1)));renderSlide();restart();send('streamlit:setFrameHeight',{height:575})});
ready();
</script>
</body>
</html>
